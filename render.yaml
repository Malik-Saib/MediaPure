databases:
  - name: mediapure-db
    databaseName: mediapure
    user: mediapure
    plan: basic-256mb
    region: ohio

services:
  - type: web
    name: mediapure-api
    runtime: docker
    plan: standard
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mediapure-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://mediapure.site,https://www.mediapure.site,http://localhost:3000,http://127.0.0.1:3000
      - key: PROCESSING_WORKERS
        value: "2"
      - key: VIDEO_WORKERS
        value: "1"
      - key: VIDEO_ENABLED
        value: "true"
      - key: USE_EXIFTOOL
        value: "true"
