# nginx for MediaPure.
# In docker-compose this is a template: ${DOMAIN} is substituted at start, and upstreams are "api"/"web".
# On a plain VPS: replace ${DOMAIN}, and point upstreams at 127.0.0.1:8000 / 127.0.0.1:3000.

upstream aimr_api { server api:8000; keepalive 16; }
upstream aimr_web { server web:3000; keepalive 16; }

limit_req_zone $binary_remote_addr zone=aimr_upload:10m rate=2r/s;
# Video uploads are few but long-lived; they get their own, gentler bucket so a single
# 500 MB transfer cannot exhaust the general API allowance.
limit_req_zone $binary_remote_addr zone=aimr_video:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://${DOMAIN}$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.${DOMAIN};
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    return 301 https://${DOMAIN}$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Images are capped at 25 MB; the video endpoints raise it to 500 MB below.
    # Nginx rejects bigger bodies before they ever reach Python.
    client_max_body_size 26m;
    client_body_timeout 60s;

    # Video: 500 MB limit + headroom, and a long enough window for a slow connection to
    # finish sending. The body is streamed, not buffered, so this costs no disk on nginx.
    location /api/v1/video/ {
        limit_req zone=aimr_video burst=8 nodelay;
        client_max_body_size 520m;
        client_body_timeout 300s;
        proxy_pass http://aimr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;                     # stream uploads; FastAPI enforces limits
        proxy_read_timeout 900s;                         # matches VIDEO_CLEAN_TIMEOUT
        proxy_send_timeout 900s;
        access_log off;                                  # job ids are in these URLs; don't log them
    }

    # API goes straight to FastAPI (no double proxying through Next.js)
    location /api/ {
        limit_req zone=aimr_upload burst=20 nodelay;
        proxy_pass http://aimr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;                     # stream uploads; FastAPI enforces limits
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        access_log off;                                  # tokens are in download URLs; don't log them
    }

    location /_next/static/ {
        proxy_pass http://aimr_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://aimr_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
